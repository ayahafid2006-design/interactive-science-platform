    <style>
        :root {
            --bg-color: #07090e;
            --panel-bg: #111823;
            --accent-blue: #3b82f6;
            --accent-orange: #ff9f43;
            --text-color: #e2e8f0;
            --neon-red: #ef4444;
        }

        body { user-select: none; -webkit-user-select: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* ── LAYOUT ── */
        .navbar {
            width: 100%;
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 6px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .navbar a:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .navbar a.active {
            color: var(--cyan);
            background: rgba(0, 210, 255, 0.1);
        }

        .workspace-area {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111e32 0%, #05080f 100%);
            border-radius: 12px;
            position: relative;
            border: 2px solid rgba(0, 210, 255, 0.15);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }

        #inventory .component {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            margin: 10px auto;
            cursor: grab;
            transform: scale(0.9);
        }

        #inventory .component:active {
            cursor: grabbing;
        }

        .component {
            position: absolute;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        /* Terminal nodes */
        .terminal-node {
            width: 14px;
            height: 14px;
            background: #e2e8f0;
            border: 3px solid #64748b;
            border-radius: 50%;
            position: absolute;
            z-index: 50;
            transform: translate(-50%, -50%);
            cursor: crosshair;
            transition: all .2s;
            pointer-events: all;
        }

        .terminal-node:hover {
            transform: translate(-50%, -50%) scale(1.4);
            background: var(--accent-orange);
            border-color: #fff;
            box-shadow: 0 0 10px var(--accent-orange);
        }

        .terminal-node.active {
            background: var(--green);
            border-color: #fff;
            box-shadow: 0 0 10px var(--green);
        }

        .dropzone {
            position: absolute;
            border: 2px dashed rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            background: rgba(0, 210, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            z-index: 5;
            transition: all 0.3s;
            transform: translate(-50%, -50%);
        }

        .dropzone.highlight {
            border-color: rgba(0, 210, 255, 0.8);
            background: rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .dropzone.occupied {
            border-color: rgba(46, 204, 113, 0.5);
            background: transparent;
            color: transparent;
            opacity: 0;
        }
    </style>
</head>

                    </svg>
                    <!-- Front (z-index 30) -->
                    <svg class="front-svg" viewBox="0 0 220 100" width="220" height="100" style="position:absolute; top:0; left:0; z-index:30; pointer-events:none;">
                        <path d="M 30 15 L 190 15 A 15 35 0 0 1 190 85 L 30 85 A 15 35 0 0 1 30 15 Z" fill="rgba(241, 245, 249, 0.55)" stroke="#94a3b8" stroke-width="2"/>
                        <ellipse cx="30" cy="50" rx="15" ry="35" fill="none" stroke="#64748b" stroke-width="2"/>
                        <!-- Front wire loops -->
                        <path d="M 50 15 A 12 35 0 0 0 50 85 M 80 15 A 12 35 0 0 0 80 85 M 110 15 A 12 35 0 0 0 110 85 M 140 15 A 12 35 0 0 0 140 85 M 170 15 A 12 35 0 0 0 170 85" fill="none" stroke="#3b82f6" stroke-width="6"/>
                        <!-- Terminal connections -->
                        <path d="M 50 85 L 50 100 M 170 85 L 170 100" fill="none" stroke="#3b82f6" stroke-width="6"/>
                    </svg>
                    <div class="terminal-node" id="t-sec-1" style="left:50px; top:100px;"></div>
                    <div class="terminal-node" id="t-sec-2" style="left:170px; top:100px;"></div>
                </div>`,
            pri_coil: `
                <div style="position:relative; width:160px; height:70px;">
                    <!-- Back (z-index 10) -->
                    <svg viewBox="0 0 160 70" width="160" height="70" style="position:absolute; top:0; left:0; z-index:10;">
                        <ellipse cx="20" cy="35" rx="10" ry="25" fill="#64748b" stroke="#475569" stroke-width="1"/>
                        <path d="M 20 10 L 140 10 L 140 60 L 20 60 Z" fill="#94a3b8" opacity="0.9"/>
                        <!-- Back wire loops -->
                        <path d="M 35 60 A 10 25 0 0 0 55 10 M 55 60 A 10 25 0 0 0 75 10 M 75 60 A 10 25 0 0 0 95 10 M 95 60 A 10 25 0 0 0 115 10 M 115 60 A 10 25 0 0 0 135 10" fill="none" stroke="#7f1d1d" stroke-width="3"/>
                    </svg>
                    <!-- Front (z-index 30) -->
                    <svg viewBox="0 0 160 70" width="160" height="70" style="position:absolute; top:0; left:0; z-index:30; pointer-events:none;">
                        <path d="M 20 10 L 140 10 A 10 25 0 0 1 140 60 L 20 60 A 10 25 0 0 1 20 10 Z" fill="rgba(241, 245, 249, 0.45)" stroke="#64748b" stroke-width="1"/>
                        <ellipse cx="20" cy="35" rx="10" ry="25" fill="none" stroke="#475569" stroke-width="1"/>
                        <!-- Front wire loops -->
                        <path d="M 35 10 A 7 25 0 0 0 35 60 M 55 10 A 7 25 0 0 0 55 60 M 75 10 A 7 25 0 0 0 75 60 M 95 10 A 7 25 0 0 0 95 60 M 115 10 A 7 25 0 0 0 115 60 M 135 10 A 7 25 0 0 0 135 60" fill="none" stroke="#ef4444" stroke-width="5"/>
                        <!-- Terminal connections -->
                        <path d="M 35 60 L 35 70 M 135 60 L 135 70" fill="none" stroke="#ef4444" stroke-width="5"/>
                    </svg>
                    <div class="terminal-node" id="t-pri-1" style="left:35px; top:70px;"></div>
                    <div class="terminal-node" id="t-pri-2" style="left:135px; top:70px;"></div>
                </div>`
        };

        const config = {
            components: {
                magnet: { id: 'magnet', name: 'المغناطيس', w: 160, h: 50 },
                sec_coil: { id: 'sec_coil', name: 'الملف الثانوي', w: 220, h: 100 },
                pri_coil: { id: 'pri_coil', name: 'الملف الابتدائي', w: 160, h: 70 },
                galv: { id: 'galv', name: 'الجلفانوميتر', w: 140, h: 114 },
                battery: { id: 'battery', name: 'البطارية', w: 96, h: 82 },
                switch: { id: 'switch', name: 'المفتاح الكهربائي', w: 96, h: 120 }
            },
            steps: {
                step1: [
                    { id: 'sec_coil', gx: 0, gy: -0.1 },
                    { id: 'magnet', gx: -0.3, gy: -0.1 },
                    { id: 'galv', gx: 0, gy: 0.3 }
                ],
                step2: [
                    { id: 'sec_coil', gx: 0.1, gy: -0.1 },
                    { id: 'pri_coil', gx: -0.25, gy: -0.1 },
                    { id: 'galv', gx: 0.1, gy: 0.3 },
                    { id: 'battery', gx: -0.25, gy: 0.3 }
                ],
                step3: [
                    { id: 'sec_coil', gx: 0.1, gy: -0.15 },
                    { id: 'pri_coil', gx: 0.05, gy: -0.15 }, // Overlapping for inside effect
                    { id: 'galv', gx: 0.3, gy: 0.25 },
                    { id: 'battery', gx: -0.3, gy: 0.25 },
                    { id: 'switch', gx: -0.1, gy: 0.25 }
                ]
            }
        };

        const REQUIRED_PAIRS = {
            step1: ['t-sec-1-t-galv-left', 't-sec-2-t-galv-right'],
            step2: ['t-sec-1-t-galv-left', 't-sec-2-t-galv-right', 't-pri-1-t-bat-pos', 't-pri-2-t-bat-neg'],
            step3: ['t-sec-1-t-galv-left', 't-sec-2-t-galv-right', 't-pri-1-t-bat-pos', 't-pri-2-t-sw-1', 't-sw-k-t-bat-neg']
        };

        const state = {
            currentStep: 'step1',
            placed: {},
            switchClosed: false,
            animating: false
        };

        let engine;

        const inventoryEl = document.getElementById('inventory');
        const workspaceEl = document.getElementById('workspace');
        const dropzonesContainer = document.getElementById('dropzones-container');
        const wiresCanvas = document.getElementById('wires-canvas');
        const statusText = document.getElementById('status-text');
        const resetBtn = document.getElementById('reset-btn');
        const wireBtn = document.getElementById('wire-btn');
        const tabBtns = document.querySelectorAll('.tab-btn');

        function init() {
            engine = new EliteEngine({
                workspaceId: 'workspace',
                onCircuitComplete: (connections) => checkWiringComplete(connections)
            });
            setupTabs();
            resetWorkspace();
            resetBtn.addEventListener('click', resetWorkspace);
            wireBtn.addEventListener('click', autoWire);
        }

        function setupTabs() {
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    if (state.currentStep === tab) return;

                    tabBtns.forEach(b => {
                        b.classList.remove('text-white', 'bg-cyber-blue', 'shadow-[0_0_15px_rgba(59,130,246,0.5)]');
                        b.classList.add('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');
                    });

                    btn.classList.add('text-white', 'bg-cyber-blue', 'shadow-[0_0_15px_rgba(59,130,246,0.5)]');
                    btn.classList.remove('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');

                    state.currentStep = tab;
                    resetWorkspace();
                });
            });
        }

        function getPos(gx, gy) {
            const rect = workspaceEl.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            return {
                x: centerX + (gx * rect.width),
                y: centerY + (gy * rect.height)
            };
        }

        function resetWorkspace() {
            Object.values(state.placed).forEach(el => {
                const d = Draggable.get(el);
                if (d) d.kill();
            });
            gsap.killTweensOf("*");

            state.placed = {};
            state.switchClosed = false;
            state.animating = false;

            if (engine && engine.jsPlumbInstance) {
                engine.jsPlumbInstance.deleteEveryConnection();
                engine.userConnections.clear();
            }

            inventoryEl.innerHTML = '';
            dropzonesContainer.innerHTML = '';
            workspaceEl.querySelectorAll('.component').forEach(el => el.remove());

            wireBtn.disabled = true;
            wireBtn.classList.remove('opacity-100', 'cursor-pointer');
            wireBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const currentConfig = config.steps[state.currentStep];

            currentConfig.forEach(cfg => {
                const comp = config.components[cfg.id];

                // Build Inventory
                const wrapper = document.createElement('div');
                wrapper.className = 'component-wrapper relative flex flex-col items-center mb-4';
                wrapper.id = `wrapper-${comp.id}`;

                const elWrapper = document.createElement('div');
                elWrapper.className = 'component';
                elWrapper.id = comp.id;
                elWrapper.innerHTML = SVG[comp.id];
                wrapper.appendChild(elWrapper);

                inventoryEl.appendChild(wrapper);

                const el = document.getElementById(comp.id);
                el.dataset.locked = 'false';
                
                engine.registerComponent(el, cfg);

                Draggable.create(el, {
                    type: "x,y",
                    edgeResistance: 0.65,
                    bounds: document.body,
                    onPress: function (e) {
                        if (this.target.dataset.locked === 'true' && this.target.id !== 'magnet' && this.target.id !== 'pri_coil') return;
                        gsap.to(this.target, { scale: 1.05, boxShadow: "0 10px 20px rgba(0,0,0,0.5)", duration: 0.2 });

                        this._dropzones = Array.from(document.querySelectorAll('.dropzone')).filter(dz => dz.dataset.accepts === this.target.id && !dz.classList.contains('occupied'));
                        if (this.target.dataset.locked !== 'true') {
                            const rect = this.target.getBoundingClientRect();
                            document.body.appendChild(this.target);
                            gsap.set(this.target, { position: 'absolute', left: rect.left, top: rect.top, x: 0, y: 0, margin: 0 });
                        }
                        this.update();
                    },
                    onDrag: function () {
                        if (this.target.dataset.locked === 'true') {
                            handleDynamicMovement(this.target);
                            if (engine && engine.jsPlumbInstance) {
                                if (!this._repainting) {
                                    this._repainting = true;
                                    requestAnimationFrame(() => {
                                        if (engine && engine.jsPlumbInstance) engine.jsPlumbInstance.revalidate(this.target);
                                        this._repainting = false;
                                    });
                                }
                            }
                            return;
                        }
                        (this._dropzones || []).forEach(dz => {
                            if (this.hitTest(dz, "50%")) dz.classList.add('highlight');
                            else dz.classList.remove('highlight');
                        });
                    },
                    onRelease: function (e) {
                        gsap.to(this.target, { scale: 1, boxShadow: "0 0 0 rgba(0,0,0,0)", duration: 0.2 });

                        if (this.target.dataset.locked === 'true') {
                            handleDynamicMovementEnd(this.target);
                            return;
                        }

                        let dropzone = null;
                        (this._dropzones || document.querySelectorAll('.dropzone')).forEach(dz => {
                            if (dz.dataset.accepts === this.target.id && !dz.classList.contains('occupied')) {
                                if (this.hitTest(dz, "50%")) dropzone = dz;
                            }
                            dz.classList.remove('highlight');
                        });

                        if (dropzone) snapToDropzone(this.target, dropzone);
                        else {
                            const wrp = document.getElementById(`wrapper-${this.target.id}`);
                            wrp.appendChild(this.target);
                            gsap.set(this.target, { position: 'relative', x: 0, y: 0, left: 'auto', top: 'auto', scale: 0.9 });
                            this.update();
                        }
                    }
                });

                // Build Dropzone
                const absPos = getPos(cfg.gx, cfg.gy);
                const dz = document.createElement('div');
                dz.className = 'dropzone';
                dz.id = `dz-${comp.id}`;
                dz.dataset.accepts = comp.id;
                dz.style.width = `${comp.w + 20}px`;
                dz.style.height = `${comp.h + 20}px`;
                dz.style.left = `${absPos.x}px`;
                dz.style.top = `${absPos.y}px`;
                dz.innerHTML = `<span>${comp.name}</span>`;
                dropzonesContainer.appendChild(dz);
            });

            setStatus('يرجى سحب المكونات من صندوق الأدوات إلى أماكنها المخصصة', 'orange');
        }

        function snapToDropzone(el, dropzone) {
            const absPos = { x: parseFloat(dropzone.style.left), y: parseFloat(dropzone.style.top) };
            const compDef = config.components[el.id];

            workspaceEl.appendChild(el);
            gsap.set(el, { left: 0, top: 0, x: 0, y: 0, scale: 1 });

            const adjustX = absPos.x - compDef.w / 2;
            const adjustY = absPos.y - compDef.h / 2;

            gsap.to(el, {
                x: adjustX,
                y: adjustY,
                duration: 0.3,
                ease: "power2.out",
                onUpdate: () => {
                    if (engine && engine.jsPlumbInstance && !el._repainting) {
                        el._repainting = true;
                        requestAnimationFrame(() => {
                            if (engine && engine.jsPlumbInstance) engine.jsPlumbInstance.revalidate(el);
                            el._repainting = false;
                        });
                    }
                },
                onComplete: () => {
                    el.dataset.locked = 'true';
                    el.style.opacity = '1';
                    el.style.visibility = 'visible';
                    el.style.display = 'block';
                    if (el.id === 'sec_coil') {
                        el.style.transform = 'none';
                        el.style.left = adjustX + 'px';
                        el.style.top = adjustY + 'px';
                        el.style.zIndex = 'auto'; // Break stacking context to allow layering
                    } else {
                        el.style.zIndex = el.id === 'magnet' || el.id === 'pri_coil' ? '20' : '9999';
                    }
                    dropzone.classList.add('occupied');
                    state.placed[el.id] = el;

                    el.querySelectorAll('.terminal-node').forEach(t => {
                        t.style.display = 'block';
                    });

                    checkAllComponentsPlaced();
                }
            });
        }

        function checkAllComponentsPlaced() {
            const currentConfig = config.steps[state.currentStep];
            if (Object.keys(state.placed).length === currentConfig.length) {
                setStatus('ممتاز! قم الآن بربط الأسلاك عبر سحبها بين الأقطاب أو استخدم التوصيل التلقائي', 'cyan');
                wireBtn.disabled = false;
                wireBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                wireBtn.classList.add('opacity-100', 'cursor-pointer');
            }
        }

        function setStatus(msg, colorStr) {
            statusText.textContent = msg;
            statusText.className = `text-lg font-bold text-cyber-${colorStr}`;
        }

        function autoWire() {
            if (!state.placed['sec_coil']) return;
            wireBtn.disabled = true;
            wireBtn.classList.remove('opacity-100', 'cursor-pointer');
            wireBtn.classList.add('opacity-50', 'cursor-not-allowed');

            engine.autoWire(REQUIRED_PAIRS[state.currentStep]);
        }

        function checkWiringComplete(connections) {
            let required = REQUIRED_PAIRS[state.currentStep].length;

            if (connections.size >= required) {
                if (state.currentStep === 'step3') {
                    setStatus('الدائرة مكتملة! انقر على المفتاح لغلقه وفتحه ولاحظ الجلفانوميتر', 'green');
                    const arm = document.getElementById('ws-switch-arm');
                    if (arm) arm.addEventListener('click', toggleSwitch);
                } else {
                    setStatus('الدائرة مكتملة! حرك المغناطيس أو الملف الابتدائي داخل الملف الثانوي', 'green');
                }
            }
        }

        // --- Physics & Interactions ---
        let lastX = 0;
        let lastMoveTime = Date.now();

        function handleDynamicMovement(el) {
            if (engine.userConnections.size < REQUIRED_PAIRS[state.currentStep].length) return; // Must be wired

            const rect = el.getBoundingClientRect();
            const now = Date.now();
            const dt = now - lastMoveTime;

            if (dt > 50) {
                const velocity = (rect.left - lastX) / dt;

                if (Math.abs(velocity) > 0.1) {
                    const needle = document.getElementById('ws-galv-needle');
                    if (needle) {
                        // Deflection proportional to velocity, capped at 35 degrees
                        let deflect = velocity * 15;
                        if (deflect > 35) deflect = 35;
                        if (deflect < -35) deflect = -35;
                        gsap.to(needle, { rotate: deflect, duration: 0.1, overwrite: true });
                        setStatus('يتولد تيار محتث نتيجة الحركة النسبية!', 'cyan');
                    }
                }

                lastX = rect.left;
                lastMoveTime = now;
            }
        }

        function handleDynamicMovementEnd(el) {
            const needle = document.getElementById('ws-galv-needle');
            if (needle) {
                gsap.to(needle, { rotate: 0, duration: 0.5, ease: 'power2.out' });
                setStatus('الدائرة مكتملة! حرك المغناطيس أو الملف الابتدائي داخل الملف الثانوي', 'green');
            }
        }

        function toggleSwitch() {
            if (state.animating) return;
            state.animating = true;
            state.switchClosed = !state.switchClosed;

            const arm = document.getElementById('ws-switch-arm');
            const needle = document.getElementById('ws-galv-needle');
            const deflect = state.switchClosed ? 30 : -30;

            gsap.to(arm, { rotate: state.switchClosed ? 0 : -30, duration: 0.2 });
            setStatus(state.switchClosed ? 'لحظة الغلق: نمو الفيض - تيار محتث موجب' : 'لحظة الفتح: تلاشي الفيض - تيار محتث سالب', state.switchClosed ? 'cyan' : 'red');

            if (needle) {
                gsap.to(needle, {
                    rotate: deflect, duration: 0.2, ease: 'power3.out',
                    onComplete: () => {
                        gsap.to(needle, {
                            rotate: 0, duration: 0.8, ease: 'power2.inOut',
                            onComplete: () => {
                                state.animating = false;
                                setStatus('الدائرة مكتملة! انقر على المفتاح لغلقه وفتحه ولاحظ الجلفانوميتر', 'green');
                            }
                        });
                    }
                });
            } else {
                state.animating = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();

            const chapterHeader = document.querySelector('.chapter-header');
            const chapterSubmenu = document.querySelector('.chapter-submenu');
            const arrowIcon = document.querySelector('.arrow-icon');
            if (chapterHeader) {
                chapterHeader.addEventListener('click', () => {
                    if (chapterSubmenu.style.maxHeight) {
                        chapterSubmenu.style.maxHeight = null;
                        arrowIcon.style.transform = 'rotate(0deg)';
                    } else {
                        chapterSubmenu.style.maxHeight = "1000px";
                        arrowIcon.style.transform = 'rotate(180deg)';
                    }
                });
            }

            const menuToggleBtn = document.getElementById('menu-toggle-btn');
            const sideDrawer = document.getElementById('side-drawer');
            const drawerCloseBtn = document.getElementById('drawer-close-btn');

            if (menuToggleBtn && sideDrawer && drawerCloseBtn) {
                menuToggleBtn.addEventListener('click', () => {
                    sideDrawer.classList.remove('-translate-x-full');
                });
                drawerCloseBtn.addEventListener('click', () => {
                    sideDrawer.classList.add('-translate-x-full');
                });
            }
        });
    </script>
    <script src="../js/global-drawer.js"></script>
    <script>
        if(window.initRaqeemResponsive) { window.initRaqeemResponsive('#workspace', 780, 460); }
    </script>
</body>

</html>
