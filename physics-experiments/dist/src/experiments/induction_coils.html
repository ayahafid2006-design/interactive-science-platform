    <style>
        :root {
            --bg-color: #07090e;
            --panel-bg: #111823;
            --accent-blue: #3b82f6;
            --accent-orange: #ff9f43;
            --text-color: #e2e8f0;
            --neon-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* ── LAYOUT ── */
        .navbar {
            width: 100%;
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 6px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .navbar a:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .navbar a.active {
            color: var(--cyan);
            background: rgba(0, 210, 255, 0.1);
        }

        .workspace-area {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111e32 0%, #05080f 100%);
            border-radius: 12px;
            position: relative;
            border: 2px solid rgba(0, 210, 255, 0.15);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }

        #wires-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .wire-path {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: stroke;
            cursor: pointer;
            transition: stroke 0.2s, filter 0.2s;
        }

        .wire-path:hover {
            stroke: #ef4444 !important;
            stroke-width: 5 !important;
        }

        #inventory .component {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            margin: 10px auto;
            cursor: grab;
            transform: scale(0.9);
        }

        #inventory .component:active {
            cursor: grabbing;
        }

        .component {
            position: absolute;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        /* Terminal nodes */
        .terminal-node {
            width: 14px;
            height: 14px;
            background: #e2e8f0;
            border: 3px solid #64748b;
            border-radius: 50%;
            position: absolute;
            z-index: 50;
            cursor: crosshair;
            transition: all .2s;
            pointer-events: all;
            margin-left: -7px;
            margin-top: -7px;
        }

        .terminal-node::after {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 50%;
            z-index: 100;
        }

        .terminal-node:hover {
            transform: scale(1.4);
            background: var(--accent-orange);
            border-color: #fff;
            box-shadow: 0 0 10px var(--accent-orange);
        }

        .terminal-node.active {
            background: var(--green);
            border-color: #fff;
            box-shadow: 0 0 10px var(--green);
        }

        .dropzone {
            position: absolute;
            border: 2px dashed rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            background: rgba(0, 210, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            z-index: 5;
            transition: all 0.3s;
            transform: translate(-50%, -50%);
        }

        .dropzone.highlight {
            border-color: rgba(0, 210, 255, 0.8);
            background: rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .dropzone.occupied {
            border-color: rgba(46, 204, 113, 0.5);
            background: transparent;
            color: transparent;
            opacity: 0;
        }
    </style>
</head>

            sec_coil: `

                        <path d="M 50 15 L 50 -10 L 40 -10" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0"/> <!-- Invisible, just for spacing if needed -->

                    <!-- Front (z-index 30) -->
                    <svg class="front-svg" viewBox="0 0 220 100" width="220" height="100" style="position:absolute; top:0; left:0; z-index:30; pointer-events:none;">

                        <ellipse cx="30" cy="50" rx="15" ry="35" fill="none" stroke="#64748b" stroke-width="2"/>
                        <!-- Front wire loops -->
                        <path d="M 50 15 A 12 35 0 0 0 50 85 M 80 15 A 12 35 0 0 0 80 85 M 110 15 A 12 35 0 0 0 110 85 M 140 15 A 12 35 0 0 0 140 85 M 170 15 A 12 35 0 0 0 170 85" fill="none" stroke="#3b82f6" stroke-width="6"/>
                        <!-- Terminal connections -->

                    <div class="terminal-node" id="t-sec-2" style="left:170px; top:100px;"></div>
                </div>`,
            pri_coil: `
                <div style="position:relative; width:160px; height:70px;">
                    <!-- Back (z-index 10) -->
                    <svg viewBox="0 0 160 70" width="160" height="70" style="position:absolute; top:0; left:0; z-index:10;">
                        <ellipse cx="20" cy="35" rx="10" ry="25" fill="#64748b" stroke="#475569" stroke-width="1"/>
                        <path d="M 20 10 L 140 10 L 140 60 L 20 60 Z" fill="#94a3b8" opacity="0.9"/>
                        <!-- Back wire loops -->
                        <path d="M 35 60 A 10 25 0 0 0 55 10 M 55 60 A 10 25 0 0 0 75 10 M 75 60 A 10 25 0 0 0 95 10 M 95 60 A 10 25 0 0 0 115 10 M 115 60 A 10 25 0 0 0 135 10" fill="none" stroke="#7f1d1d" stroke-width="3"/>
                    </svg>
                    <!-- Front (z-index 30) -->
                    <svg viewBox="0 0 160 70" width="160" height="70" style="position:absolute; top:0; left:0; z-index:30; pointer-events:none;">
                        <path d="M 20 10 L 140 10 A 10 25 0 0 1 140 60 L 20 60 A 10 25 0 0 1 20 10 Z" fill="rgba(241, 245, 249, 0.45)" stroke="#64748b" stroke-width="1"/>
                        <ellipse cx="20" cy="35" rx="10" ry="25" fill="none" stroke="#475569" stroke-width="1"/>
                        <!-- Front wire loops -->
                        <path d="M 35 10 A 7 25 0 0 0 35 60 M 55 10 A 7 25 0 0 0 55 60 M 75 10 A 7 25 0 0 0 75 60 M 95 10 A 7 25 0 0 0 95 60 M 115 10 A 7 25 0 0 0 115 60 M 135 10 A 7 25 0 0 0 135 60" fill="none" stroke="#ef4444" stroke-width="5"/>
                        <!-- Terminal connections -->
                        <path d="M 35 60 L 35 70 M 135 60 L 135 70" fill="none" stroke="#ef4444" stroke-width="5"/>
                    </svg>
                    <div class="terminal-node" id="t-pri-1" style="left:35px; top:70px;"></div>
                    <div class="terminal-node" id="t-pri-2" style="left:135px; top:70px;"></div>
                </div>`
        };

        const config = {
            components: {
                magnet: { id: 'magnet', name: 'المغناطيس', w: 160, h: 50 },
                sec_coil: { id: 'sec_coil', name: 'الملف الثانوي', w: 220, h: 100 },
                pri_coil: { id: 'pri_coil', name: 'الملف الابتدائي', w: 160, h: 70 },
                galv: { id: 'galv', name: 'الجلفانوميتر', w: 140, h: 114 },
                battery: { id: 'battery', name: 'البطارية', w: 96, h: 82 },
                switch: { id: 'switch', name: 'المفتاح الكهربائي', w: 96, h: 120 }
            },
            steps: {
                step1: [
                    { id: 'sec_coil', gx: 0, gy: -0.1 },
                    { id: 'magnet', gx: -0.3, gy: -0.1 },
                    { id: 'galv', gx: 0, gy: 0.3 }
                ],
                step2: [
                    { id: 'sec_coil', gx: 0.1, gy: -0.1 },
                    { id: 'pri_coil', gx: -0.3, gy: -0.1 },
                    { id: 'battery', gx: -0.3, gy: 0.3 },
                    { id: 'galv', gx: 0.1, gy: 0.3 }
                ],
                step3: [
                    { id: 'sec_coil', gx: 0.1, gy: -0.1 },
                    { id: 'pri_coil', gx: 0.1, gy: -0.1 },
                    { id: 'battery', gx: -0.3, gy: 0.3 },
                    { id: 'switch', gx: -0.1, gy: 0.3 },
                    { id: 'galv', gx: 0.3, gy: 0.3 }
                ]
            }
        };

        
        const REQUIRED_PAIRS = {
            step1: [['t-sec-1', 't-galv-left', '#3b82f6'], ['t-sec-2', 't-galv-right', '#3b82f6']],
            step2: [
                ['t-sec-1', 't-galv-left', '#3b82f6'], 
                ['t-sec-2', 't-galv-right', '#3b82f6'],
                ['t-pri-1', 't-bat-pos', '#ef4444'], // Crossed as in Fig 11-c
                ['t-pri-2', 't-bat-neg', '#1e3a8a']  // Crossed as in Fig 11-c
            ],
            step3: [
                ['t-sec-1', 't-galv-left', '#3b82f6'], 
                ['t-sec-2', 't-galv-right', '#3b82f6'],
                ['t-pri-1', 't-bat-neg', '#1e3a8a'],  // Battery left to Primary left (Fig 11-d)
                ['t-bat-pos', 't-sw-1', '#ef4444'],   // Battery right to Switch left (Fig 11-d)
                ['t-sw-k', 't-pri-2', '#ef4444']      // Switch right to Primary right (Fig 11-d)
            ]
        };

        function getAllowedPairs(step) {
            return REQUIRED_PAIRS[step].map(p => `${p[0]}-${p[1]}`);
        }
        const state = { currentStep: 'step1', placed: {}, circuitValid: false, switchClosed: false, animating: false };
        let engine;


        const inventoryEl = document.getElementById('inventory');
        const workspaceEl = document.getElementById('workspace');
        const dropzonesContainer = document.getElementById('dropzones-container');
        const wiresCanvas = document.getElementById('wires-canvas');
        const statusText = document.getElementById('status-text');
        const resetBtn = document.getElementById('reset-btn');
        const wireBtn = document.getElementById('wire-btn');
        const tabBtns = document.querySelectorAll('.tab-btn');

        function init() {
            engine = new EliteEngine({
                workspaceId: 'workspace',
                wireBtnId: 'wire-btn',
                expectedPairs: getAllowedPairs(state.currentStep),
                onCircuitComplete: checkWiringComplete
            });
            setupTabs();
            resetWorkspace();
            resetBtn.addEventListener('click', resetWorkspace);
            wireBtn.addEventListener('click', autoWire);
        }

        function setupTabs() {
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    if (state.currentStep === tab) return;

                    tabBtns.forEach(b => {
                        b.classList.remove('text-white', 'bg-cyber-blue', 'shadow-[0_0_15px_rgba(59,130,246,0.5)]');
                        b.classList.add('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');
                    });

                    btn.classList.add('text-white', 'bg-cyber-blue', 'shadow-[0_0_15px_rgba(59,130,246,0.5)]');
                    btn.classList.remove('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');

                    state.currentStep = tab;
                    resetWorkspace();
                });
            });
        }

        function getPos(gx, gy) {
            const rect = workspaceEl.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            return {
                x: centerX + (gx * rect.width),
                y: centerY + (gy * rect.height)
            };
        }

        function resetWorkspace() {
            Object.values(state.placed).forEach(el => {
                const d = Draggable.get(el);
                if (d) d.kill();
            });
            gsap.killTweensOf("*");

            state.placed = {};
            
            state.circuitValid = false;
            state.switchClosed = false;
            state.animating = false;
            if (engine && engine.jsPlumbInstance) {
                engine.jsPlumbInstance.reset(); // Destroy old jsPlumb instance completely
            }

            // Recreate engine for a 100% clean state
            engine = new EliteEngine({
                workspaceId: 'workspace',
                wireBtnId: 'wire-btn',
                expectedPairs: getAllowedPairs(state.currentStep),
                onCircuitComplete: checkWiringComplete
            });

            inventoryEl.innerHTML = '';
            dropzonesContainer.innerHTML = '';
            
            workspaceEl.querySelectorAll('.component').forEach(el => el.remove());

            wireBtn.disabled = true;
            wireBtn.classList.remove('opacity-100', 'cursor-pointer');
            wireBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const currentConfig = config.steps[state.currentStep];

            currentConfig.forEach(cfg => {
                const comp = config.components[cfg.id];

                // Build Inventory
                const wrapper = document.createElement('div');
                wrapper.className = 'component-wrapper relative flex flex-col items-center mb-4';
                wrapper.id = `wrapper-${comp.id}`;

                const elWrapper = document.createElement('div');
                elWrapper.className = 'component';
                elWrapper.id = comp.id;
                elWrapper.innerHTML = SVG[comp.id];
                wrapper.appendChild(elWrapper);

                inventoryEl.appendChild(wrapper);

                const el = document.getElementById(comp.id);
                el.dataset.locked = 'false';
                el.querySelectorAll('.terminal-node').forEach(t => {
                    t.style.display = 'none';
                    t.dataset.clickable = 'true';
                });

                Draggable.create(el, {
                    type: "left,top",
                    edgeResistance: 0.65,
                    bounds: document.body,
                    onPress: function (e) {
                        if (this.target.dataset.locked === 'true' && this.target.id !== 'magnet' && this.target.id !== 'pri_coil') return;
                        gsap.to(this.target, { scale: 1.05, boxShadow: "0 10px 20px rgba(0,0,0,0.5)", duration: 0.2 });

                        this._dropzones = Array.from(document.querySelectorAll('.dropzone')).filter(dz => dz.dataset.accepts === this.target.id && !dz.classList.contains('occupied'));
                        if (this.target.dataset.locked !== 'true') {
                            const rect = this.target.getBoundingClientRect();
                            document.body.appendChild(this.target);
                            gsap.set(this.target, { position: 'absolute', left: rect.left, top: rect.top, x: 0, y: 0, margin: 0 });
                        }
                        this.update();
                    },
                    onDrag: function () {
                        if (this.target.dataset.locked === 'true') {
                            handleDynamicMovement(this.target);
                            updateWires(this.target);
                            return;
                        }
                        (this._dropzones || []).forEach(dz => {
                            if (this.hitTest(dz, "50%")) dz.classList.add('highlight');
                            else dz.classList.remove('highlight');
                        });
                    },
                    onRelease: function (e) {
                        gsap.to(this.target, { scale: 1, boxShadow: "0 0 0 rgba(0,0,0,0)", duration: 0.2 });

                        if (this.target.dataset.locked === 'true') {
                            handleDynamicMovementEnd(this.target);
                            
                            // Snap back to dropzone automatically
                            const dz = document.getElementById(`dz-${this.target.id}`);
                            if (dz) {
                                const dzRect = dz.getBoundingClientRect();
                                const workRect = workspaceEl.getBoundingClientRect();
                                const compDef = config.components[this.target.id];

                                const absX = dzRect.left - workRect.left + (dzRect.width / 2) - (compDef.w / 2);
                                const absY = dzRect.top - workRect.top + (dzRect.height / 2) - (compDef.h / 2);

                                gsap.to(this.target, { 
                                    left: absX, 
                                    top: absY, 

                                    duration: 0.3, 
                                    ease: "power2.out", 
                                    onUpdate: () => updateWires(this.target) 
                                });
                            }
                            return;
                        }

                        let dropzone = null;
                        (this._dropzones || document.querySelectorAll('.dropzone')).forEach(dz => {
                            if (dz.dataset.accepts === this.target.id && !dz.classList.contains('occupied')) {
                                if (this.hitTest(dz, "50%")) dropzone = dz;
                            }
                            dz.classList.remove('highlight');
                        });

                        if (dropzone) snapToDropzone(this.target, dropzone);
                        else {
                            const wrp = document.getElementById(`wrapper-${this.target.id}`);
                            wrp.appendChild(this.target);
                            gsap.set(this.target, { position: 'relative', x: 0, y: 0, left: 'auto', top: 'auto', scale: 0.9 });
                            this.update();
                        }
                    }
                });

                // Build Dropzone
                const absPos = getPos(cfg.gx, cfg.gy);
                const dz = document.createElement('div');
                dz.className = 'dropzone';
                dz.id = `dz-${comp.id}`;
                dz.dataset.accepts = comp.id;
                dz.style.width = `${comp.w + 20}px`;
                dz.style.height = `${comp.h + 20}px`;
                dz.style.left = `${absPos.x}px`;
                dz.style.top = `${absPos.y}px`;
                dz.innerHTML = `<span>${comp.name}</span>`;
                dropzonesContainer.appendChild(dz);
            });

            setStatus('يرجى سحب المكونات من صندوق الأدوات إلى أماكنها المخصصة', 'orange');
        }

        function snapToDropzone(el, dropzone) {
            const absPos = { x: parseFloat(dropzone.style.left), y: parseFloat(dropzone.style.top) };
            const compDef = config.components[el.id];

            workspaceEl.appendChild(el);
            gsap.set(el, { left: 0, top: 0, x: 0, y: 0, scale: 1 });

            const adjustX = absPos.x - compDef.w / 2;
            const adjustY = absPos.y - compDef.h / 2;

            gsap.to(el, {
                left: adjustX,
                top: adjustY,
                x: 0,
                y: 0,
                duration: 0.3,
                ease: "power2.out",
                onUpdate: () => updateWires(el),
                onComplete: () => {
                    el.dataset.locked = 'true';
                    el.style.opacity = '1';
                    el.style.visibility = 'visible';
                    el.style.display = 'block';
                    el.style.transform = 'none'; // Clear transform for JSPlumb
                    
                    if (el.id === 'sec_coil') {
                        el.style.zIndex = 'auto'; // Break stacking context to allow front/back 3D effect
                    } else if (el.id === 'pri_coil') {
                        el.style.zIndex = '20'; // Place pri_coil BETWEEN sec_coil back (10) and front (30)
                    } else {
                        el.style.zIndex = el.id === 'magnet' ? '20' : '9999';
                    }
                    dropzone.classList.add('occupied');
                    state.placed[el.id] = el;

                    if (el.id !== 'magnet' && el.id !== 'pri_coil') {
                        const d = Draggable.get(el);
                        if (d) d.disable();
                    }

                    el.querySelectorAll('.terminal-node').forEach(t => {
                        t.style.display = 'block'; t.classList.add('elite-terminal');
                    });

                    checkAllComponentsPlaced();
                }
            });
        }

        function checkAllComponentsPlaced() {
            const currentConfig = config.steps[state.currentStep];
            if (Object.keys(state.placed).length === currentConfig.length) { engine.setupTerminals();
                setStatus('ممتاز! قم الآن بربط الأسلاك عبر سحبها بين الأقطاب أو استخدم التوصيل التلقائي', 'cyan');
                wireBtn.disabled = false;
                wireBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                wireBtn.classList.add('opacity-100', 'cursor-pointer');
            }
        }

        function setStatus(msg, colorStr) {
            statusText.textContent = msg;
            statusText.className = `text-lg font-bold text-cyber-${colorStr}`;
        }

        
        function autoWire() {
            if (!state.placed['sec_coil']) return;
            
            wireBtn.disabled = true;
            wireBtn.classList.remove('opacity-100', 'cursor-pointer');
            wireBtn.classList.add('opacity-50', 'cursor-not-allowed');

            REQUIRED_PAIRS[state.currentStep].forEach(pair => {
                if (engine && engine.jsPlumbInstance) {
                    engine.jsPlumbInstance.connect({
                        source: pair[0],
                        target: pair[1],
                        paintStyle: { stroke: pair[2], strokeWidth: 4 }
                    });
                }
            });
        }

        function updateWires(targetEl) {
            if (engine && engine.jsPlumbInstance) {
                if (targetEl && !targetEl._repainting) {
                    targetEl._repainting = true;
                    requestAnimationFrame(() => {
                        if (engine && engine.jsPlumbInstance) engine.jsPlumbInstance.revalidate(targetEl);
                        targetEl._repainting = false;
                    });
                } else if (!targetEl) {
                    engine.jsPlumbInstance.repaintEverything();
                }
            }
        }

        function checkWiringComplete(connections) {
            let required = 2;
            if (state.currentStep === 'step2') required = 4;
            if (state.currentStep === 'step3') required = 5;

            // connections is a Set from EliteEngine
            const count = connections ? connections.size : 0;

            if (count >= required) {
                state.circuitValid = true;
                if (state.currentStep === 'step3') {
                    setStatus('الدائرة مكتملة! انقر على المفتاح لغلقه وفتحه ولاحظ الجلفانوميتر', 'green');
                    const arm = document.getElementById('ws-switch-arm');
                    const clickArea = document.getElementById('ws-switch-click-area');
                    if (arm) arm.addEventListener('click', toggleSwitch);
                    if (clickArea) clickArea.addEventListener('click', toggleSwitch);
                } else {
                    setStatus('الدائرة مكتملة! حرك المغناطيس أو الملف الابتدائي داخل الملف الثانوي', 'green');
                }
            } else {
                state.circuitValid = false;
            }
        }

        // --- Physics & Interactions ---
        let lastOverlap = 0;
        let lastMoveTime = Date.now();

        function getOverlapWidth(el1, el2) {
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();
            const maxL = Math.max(r1.left, r2.left);
            const minR = Math.min(r1.right, r2.right);
            return Math.max(0, minR - maxL);
        }

        function handleDynamicMovement(el) {

            if (!state.circuitValid) return; // Must be wired

            const secCoil = state.placed['sec_coil'];
            if (!secCoil) return;

            const now = Date.now();
            const dt = now - lastMoveTime;

            if (dt > 30) { // faster refresh
                const currentOverlap = getOverlapWidth(el, secCoil);
                const dFlux = (currentOverlap - lastOverlap) / dt;

                const needle = document.getElementById('ws-galv-needle');
                if (Math.abs(dFlux) > 0.05) {
                    if (needle) {
                        // Deflection proportional to rate of change of overlap (flux)
                        let deflect = dFlux * 150;
                        if (deflect > 35) deflect = 35;
                        if (deflect < -35) deflect = -35;
                        gsap.to(needle, { rotate: deflect, duration: 0.1, overwrite: true });
                        setStatus('يتولد تيار محتث نتيجة تغير الفيض المغناطيسي!', 'cyan');
                    }
                } else {
                    if (needle) gsap.to(needle, { rotate: 0, duration: 0.2, overwrite: true });
                }

                lastOverlap = currentOverlap;
                lastMoveTime = now;
            }
        }

        function handleDynamicMovementEnd(el) {
            const needle = document.getElementById('ws-galv-needle');
            if (needle) {
                gsap.to(needle, { rotate: 0, duration: 0.5, ease: 'power2.out' });
            }
            if (state.circuitValid) {
                if (state.currentStep === 'step3') {
                    setStatus('الدائرة مكتملة! انقر على المفتاح لغلقه وفتحه ولاحظ الجلفانوميتر', 'green');
                } else {
                    setStatus('الدائرة مكتملة! حرك المغناطيس أو الملف الابتدائي داخل الملف الثانوي', 'green');
                }
            } else {
                setStatus('ممتاز! قم الآن بربط الأسلاك عبر سحبها بين الأقطاب أو استخدم التوصيل التلقائي', 'cyan');
            }
        }

        function toggleSwitch() {
            if (state.animating) return;
            state.animating = true;
            state.switchClosed = !state.switchClosed;

            const arm = document.getElementById('ws-switch-arm');
            const needle = document.getElementById('ws-galv-needle');
            const deflect = state.switchClosed ? 30 : -30;

            gsap.to(arm, { rotate: state.switchClosed ? 0 : -30, duration: 0.2 });
            setStatus(state.switchClosed ? 'لحظة الغلق: نمو الفيض - تيار محتث موجب' : 'لحظة الفتح: تلاشي الفيض - تيار محتث سالب', state.switchClosed ? 'cyan' : 'red');

            if (needle) {
                gsap.to(needle, {
                    rotate: deflect, duration: 0.2, ease: 'power3.out',
                    onComplete: () => {
                        gsap.to(needle, {
                            rotate: 0, duration: 0.8, ease: 'power2.inOut',
                            onComplete: () => {
                                state.animating = false;
                                setStatus('الدائرة مكتملة! انقر على المفتاح لغلقه وفتحه ولاحظ الجلفانوميتر', 'green');
                            }
                        });
                    }
                });
            } else {
                state.animating = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();

            const chapterHeader = document.querySelector('.chapter-header');
            const chapterSubmenu = document.querySelector('.chapter-submenu');
            const arrowIcon = document.querySelector('.arrow-icon');
            if (chapterHeader) {
                chapterHeader.addEventListener('click', () => {
                    if (chapterSubmenu.style.maxHeight) {
                        chapterSubmenu.style.maxHeight = null;
                        arrowIcon.style.transform = 'rotate(0deg)';
                    } else {
                        chapterSubmenu.style.maxHeight = "1000px";
                        arrowIcon.style.transform = 'rotate(180deg)';
                    }
                });
            }

            const menuToggleBtn = document.getElementById('menu-toggle-btn');
            const sideDrawer = document.getElementById('side-drawer');
            const drawerCloseBtn = document.getElementById('drawer-close-btn');

            if (menuToggleBtn && sideDrawer && drawerCloseBtn) {
                menuToggleBtn.addEventListener('click', () => {
                    sideDrawer.classList.remove('-translate-x-full');
                });
                drawerCloseBtn.addEventListener('click', () => {
                    sideDrawer.classList.add('-translate-x-full');
                });
            }

            // --- Magnetic Field Animation ---
            const mCanvas = document.getElementById('mfield-canvas');
            const mCtx = mCanvas ? mCanvas.getContext('2d') : null;
            let mTime = 0;

            function resizeCanvas() {
                if (!mCanvas) return;
                const rect = workspaceEl.getBoundingClientRect();
                mCanvas.width = rect.width;
                mCanvas.height = rect.height;
            }

            window.addEventListener('resize', resizeCanvas);

            function drawMagneticField() {
                if (!mCtx) return;
                if (!mCanvas.width) resizeCanvas();
                mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
                
                const magnet = state.placed['magnet'];
                const priCoil = state.placed['pri_coil'];
                const secCoil = state.placed['sec_coil'];
                
                const sourceEl = magnet || priCoil;
                
                if (sourceEl) {
                    let hasField = false;
                    // Only show field if magnet is placed in the workspace
                    if (sourceEl.id === 'magnet' && sourceEl.dataset.locked === 'true') hasField = true;
                    if (sourceEl.id === 'pri_coil') {
                        if (state.currentStep === 'step2' && state.circuitValid) hasField = true;
                        if (state.currentStep === 'step3' && state.circuitValid && state.switchClosed) hasField = true;
                    }
                    
                if (hasField) {
                    const srcRect = sourceEl.getBoundingClientRect();
                    const workRect = workspaceEl.getBoundingClientRect();
                    
                    const cx = srcRect.left - workRect.left + srcRect.width / 2;
                    const cy = srcRect.top - workRect.top + srcRect.height / 2;
                    
                    let overlapRatio = 0;
                    if (secCoil) {
                        const maxW = Math.min(srcRect.width, secCoil.getBoundingClientRect().width);
                        overlapRatio = getOverlapWidth(sourceEl, secCoil) / maxW;
                        if (overlapRatio > 1) overlapRatio = 1;
                    }
                    
                    const poleDist = srcRect.width * 0.35; 
                    const nPoleX = cx - poleDist;
                    const sPoleX = cx + poleDist;
                    
                    const pulse = Math.sin(mTime * 3) * 0.5 + 0.5;
                    const baseAlpha = 0.2 + (overlapRatio * 0.5) + (pulse * 0.1);
                    
                    mCtx.lineCap = 'round';
                    mCtx.lineJoin = 'round';
                    mCtx.setLineDash([15, 25]);
                    
                    // The field lines accelerate as overlap increases
                    const flowSpeed = 30 + (overlapRatio * 40);
                    mCtx.lineDashOffset = -mTime * flowSpeed;
                    
                    const numLines = 7;
                    for (let i = 1; i <= numLines; i++) {
                        const h = i * 22 + (overlapRatio * 15);
                        
                        const drawCurves = () => {
                            mCtx.beginPath();
                            mCtx.moveTo(nPoleX, cy);
                            mCtx.bezierCurveTo(nPoleX - h/1.5, cy - h, sPoleX + h/1.5, cy - h, sPoleX, cy);
                            mCtx.stroke();
                            
                            mCtx.beginPath();
                            mCtx.moveTo(nPoleX, cy);
                            mCtx.bezierCurveTo(nPoleX - h/1.5, cy + h, sPoleX + h/1.5, cy + h, sPoleX, cy);
                            mCtx.stroke();
                        };

                        // 1. Outer Glow (Simulated with thick transparent stroke for performance)
                        mCtx.strokeStyle = `rgba(0, 210, 255, ${baseAlpha * 0.2})`;
                        mCtx.lineWidth = 12 + overlapRatio * 6;
                        mCtx.shadowBlur = 0; // Expensive shadow turned off
                        drawCurves();
                        
                        // 2. Inner Glow
                        mCtx.strokeStyle = `rgba(0, 210, 255, ${baseAlpha * 0.5})`;
                        mCtx.lineWidth = 5 + overlapRatio * 2;
                        drawCurves();
                        
                        // 3. Core Line
                        mCtx.strokeStyle = `rgba(255, 255, 255, ${baseAlpha + 0.3})`;
                        mCtx.lineWidth = 1.5;
                        drawCurves();
                    }
                    
                    // Center straight line (Glow + Core)
                    const drawCenter = () => {
                        mCtx.beginPath();
                        mCtx.moveTo(nPoleX, cy);
                        mCtx.lineTo(sPoleX, cy);
                        mCtx.stroke();
                    };
                    
                    mCtx.strokeStyle = `rgba(0, 210, 255, ${baseAlpha * 0.25})`;
                    mCtx.lineWidth = 12;
                    drawCenter();
                    
                    mCtx.strokeStyle = `rgba(0, 210, 255, ${baseAlpha * 0.6})`;
                    mCtx.lineWidth = 5;
                    drawCenter();
                    
                    mCtx.strokeStyle = `rgba(255, 255, 255, ${baseAlpha + 0.4})`;
                    mCtx.lineWidth = 2;
                    drawCenter();
                    
                    mCtx.setLineDash([]);
                }
                }
                
                mTime += 0.05;
                requestAnimationFrame(drawMagneticField);
            }

            // --- Explanation Modal Logic ---
            const explanations = {
                step1: `<div class="bg-cyan-900/20 p-4 rounded-xl border border-cyan-500/20" dir="rtl">
                            <h3 class="text-cyan-400 font-bold mb-2"><i class="fa-solid fa-bolt ml-2"></i> عند تقريب وإبعاد المغناطيس:</h3>
                            <p>عند تقريب القطب الشمالي للمغناطيس نحو الملف، يتزايد الفيض المغناطيسي الذي يخترق الملف، مما يؤدي إلى تولد قوة دافعة كهربائية محتثة وانسياب تيار محتث في الملف (ينحرف مؤشر الجلفانوميتر). وعند الإبعاد يتناقص الفيض، فينعكس اتجاه التيار.</p>
                        </div>
                        <div class="bg-amber-900/20 p-4 rounded-xl border border-amber-500/20 mt-4" dir="rtl">
                            <h3 class="text-amber-400 font-bold mb-2"><i class="fa-solid fa-lightbulb ml-2"></i> الاستنتاج:</h3>
                            <p>تتولد قوة دافعة كهربائية محتثة وينساب تيار محتث في دائرة كهربائية مقفلة <strong>فقط</strong> عند حصول تغير في الفيض المغناطيسي الذي يخترق الدائرة لوحدة الزمن.</p>
                        </div>`,
                step2: `<div class="bg-cyan-900/20 p-4 rounded-xl border border-cyan-500/20" dir="rtl">
                            <h3 class="text-cyan-400 font-bold mb-2"><i class="fa-solid fa-bolt ml-2"></i> الحركة النسبية بين الملفين:</h3>
                            <p>عند ربط الملف الابتدائي ببطارية (يصبح مغناطيساً كهربائياً)، ثم تقريبه وإبعاده من الملف الثانوي، يحصل تغير في الفيض المغناطيسي الذي يخترق الملف الثانوي، مما يؤدي إلى انحراف مؤشر الجلفانوميتر في اتجاهين متعاكسين.</p>
                        </div>
                        <div class="bg-amber-900/20 p-4 rounded-xl border border-amber-500/20 mt-4" dir="rtl">
                            <h3 class="text-amber-400 font-bold mb-2"><i class="fa-solid fa-lightbulb ml-2"></i> الاستنتاج:</h3>
                            <p>الحركة النسبية بين الملفين (والتي تسبب تغيراً في الفيض المغناطيسي) هي السبب الأساسي في تولد قوة دافعة كهربائية محتثة وتيار محتث في دائرة الملف الثانوي.</p>
                        </div>`,
                step3: `<div class="bg-cyan-900/20 p-4 rounded-xl border border-cyan-500/20" dir="rtl">
                            <h3 class="text-cyan-400 font-bold mb-2"><i class="fa-solid fa-bolt ml-2"></i> لحظة الغلق والفتح:</h3>
                            <p>عند إدخال الملف الابتدائي في جوف الملف الثانوي والمحافظة على ثبوتهما، لا يتولد تيار. ولكن <strong>لحظة غلق</strong> مفتاح دائرة الملف الابتدائي (تنامي التيار) يتزايد الفيض المغناطيسي فينحرف المؤشر. و<strong>لحظة فتح</strong> المفتاح (تلاشي التيار) يتناقص الفيض فينحرف المؤشر بالاتجاه المعاكس.</p>
                        </div>
                        <div class="bg-amber-900/20 p-4 rounded-xl border border-amber-500/20 mt-4" dir="rtl">
                            <h3 class="text-amber-400 font-bold mb-2"><i class="fa-solid fa-lightbulb ml-2"></i> الاستنتاج:</h3>
                            <p>يمكن توليد تيار محتث في الملف الثانوي دون حركة نسبية، وذلك بالاعتماد على <strong>تنامي وتلاشي التيار</strong> في دائرة الملف الابتدائي والذي يسبب تغيراً في الفيض المغناطيسي الذي يخترق الملف الثانوي.</p>
                        </div>`
            };

            const explanationModal = document.getElementById('explanation-modal');
            const explanationContent = document.getElementById('explanation-content');
            const infoBtn = document.getElementById('info-btn');
            const closeExplanationBtn = document.getElementById('close-explanation-btn');

            infoBtn.addEventListener('click', () => {
                explanationContent.innerHTML = explanations[state.currentStep];
                explanationModal.classList.remove('hidden');
                explanationModal.classList.add('flex');
                requestAnimationFrame(() => {
                    explanationModal.classList.remove('opacity-0');
                    explanationModal.firstElementChild.classList.remove('scale-95');
                    explanationModal.firstElementChild.classList.add('scale-100');
                });
            });

            closeExplanationBtn.addEventListener('click', () => {
                explanationModal.classList.add('opacity-0');
                explanationModal.firstElementChild.classList.remove('scale-100');
                explanationModal.firstElementChild.classList.add('scale-95');
                setTimeout(() => {
                    explanationModal.classList.add('hidden');
                    explanationModal.classList.remove('flex');
                }, 300);
            });

            // --- Init ---
            init();
            resizeCanvas();
            drawMagneticField();
        });
    </script>

    <!-- Explanation Modal -->
    <div id="explanation-modal" class="fixed inset-0 z-[10001] hidden items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0" dir="rtl">
        <div class="bg-[#0a101a] border border-amber-500/30 rounded-2xl shadow-[0_0_40px_rgba(245,158,11,0.15)] p-6 max-w-lg w-[90%] transform scale-95 transition-transform duration-300">
            <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                <h2 class="text-2xl font-bold text-amber-400 font-outfit flex items-center gap-3">
                    <i class="fa-solid fa-microscope text-2xl"></i> التحليل والاستنتاج
                </h2>
                <button id="close-explanation-btn" class="text-slate-400 hover:text-white hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center transition-all">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="explanation-content" class="text-slate-200 text-base leading-relaxed space-y-4 font-outfit">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>
    <script src="../js/global-drawer.js"></script>
    <script>
        if(window.initRaqeemResponsive) { window.initRaqeemResponsive('#workspace', 780, 460); }
    </script>
</body>

</html>
